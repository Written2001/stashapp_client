[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stashapp-client"
version = "0.1.4"
description = "Python client for the Stash GraphQL API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Written2001", email = "knasdkn@protonmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "graphql-core>=3.2",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
docs = [
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=0.29",
]

[project.scripts]
stashapp-client = "stashapp_client.cli:main"

[project.urls]
Homepage = "https://github.com/Written2001/stashapp_client"
Repository = "https://github.com/Written2001/stashapp_client"
Issues = "https://github.com/Written2001/stashapp_client/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stashapp_client = ["generated/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
