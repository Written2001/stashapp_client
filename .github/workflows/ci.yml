name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e '.[dev]' build twine
      - name: Run tests
        run: python -m pytest -q
      - name: Run lint
        run: ruff check src tools tests
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke test wheel installation
        run: |
          python -m venv /tmp/stashapp-client-wheel
          /tmp/stashapp-client-wheel/bin/python -m pip install dist/*.whl
          /tmp/stashapp-client-wheel/bin/python -c "import stashapp_client; from stashapp_client import StashClient; print(StashClient.__name__)"
