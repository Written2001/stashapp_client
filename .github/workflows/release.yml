name: Release Python package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      package_name: ${{ steps.metadata.outputs.package_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Read package metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              project = tomllib.load(project_file)["project"]

          version = project["version"]
          release_tag = (
              os.environ["INPUT_TAG"]
              if os.environ["EVENT_NAME"] == "workflow_dispatch"
              else f"v{version}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output_file:
              print(f"package_name={project['name']}", file=output_file)
              print(f"package_version={version}", file=output_file)
              print(f"release_tag={release_tag}", file=output_file)
          PY

      - name: Validate release metadata
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${RELEASE_TAG#v}" == "$PACKAGE_VERSION" ]]
          grep -q "^## \[$PACKAGE_VERSION\] - " CHANGELOG.md

      - name: Create and push release tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Verify tagged commit is on main
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          git fetch origin main --no-tags
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          git merge-base --is-ancestor "$tag_sha" origin/main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$tag_sha" \
              --title "$PACKAGE_NAME ${RELEASE_TAG#v}" \
              --generate-notes
          fi

  build:
    name: Build distributions
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_name: ${{ needs.release.outputs.package_name }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.release_tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.package_name }}
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
