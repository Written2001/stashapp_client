name: Release Python package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      package_name: ${{ steps.metadata.outputs.package_name }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Read package metadata
        id: metadata
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              project = tomllib.load(project_file)["project"]

          with open(os.environ["GITHUB_OUTPUT"], "a") as output_file:
              print(f"package_name={project['name']}", file=output_file)
              print(f"package_version={project['version']}", file=output_file)
          PY

      - name: Validate SemVer tag
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${RELEASE_TAG#v}" == "$PACKAGE_VERSION" ]]

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main --no-tags
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          git merge-base --is-ancestor "$tag_sha" origin/main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
        run: |
          tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$tag_sha" \
              --title "$PACKAGE_NAME ${RELEASE_TAG#v}" \
              --generate-notes
          fi

  build:
    name: Build distributions
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_name: ${{ needs.release.outputs.package_name }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.package_name }}
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
